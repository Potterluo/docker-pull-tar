# Release: on a v* tag, build cross-platform binaries (UI embedded) and attach
# them to a GitHub Release.
#
# Build then publish, in separate jobs. Creating the release from inside the
# build matrix meant every leg called action-gh-release, and the generated notes
# were appended once per leg — the published body was "Full Changelog" repeated
# five times. Artifacts are collected first and the release is created once.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ""    }
          - { goos: linux,   goarch: arm64, ext: ""    }
          - { goos: darwin,  goarch: amd64, ext: ""    }
          - { goos: darwin,  goarch: arm64, ext: ""    }
          - { goos: windows, goarch: amd64, ext: .exe  }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded frontend
        run: |
          cd web && pnpm install --frozen-lockfile && pnpm build
          cd ..
          rm -rf internal/server/dist && cp -r web/out internal/server/dist
      - name: Build binary
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          NAME=dockerpull_${{ matrix.goos }}_${{ matrix.goarch }}
          # The binary is dockerpull (dockerpull.exe on Windows). The old recipe
          # here packaged "$NAME/app$ext", a file nothing built, so the zip/tar
          # step failed and produced no release at all.
          BIN=dockerpull${{ matrix.ext }}
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} \
            -X github.com/Potterluo/docker-pull-tar/internal/buildinfo.Version=${VERSION} \
            -X github.com/Potterluo/docker-pull-tar/internal/buildinfo.Commit=${COMMIT}"
          mkdir -p "dist/${NAME}"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags "${LDFLAGS}" -o "dist/${NAME}/${BIN}" ./cmd/server
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -q "${NAME}.zip" "${NAME}/${BIN}"
          else
            tar -czf "${NAME}.tar.gz" -C "${NAME}" "${BIN}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dockerpull_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  # The desktop shell cannot be built from Linux: it is a Wails app, and it needs
  # the -H windowsgui linker flag, without which the artifact opens a console
  # window on every launch.
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build embedded frontend
        shell: pwsh
        run: |
          cd web; pnpm install --frozen-lockfile; pnpm build
          cd ..
          Remove-Item -Recurse -Force internal/server/dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse web/out internal/server/dist
      - name: Build desktop shell (GUI subsystem, no console window)
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          $ld = "-s -w -X main.version=$env:VERSION -X main.commit=$env:COMMIT " +
                "-X github.com/Potterluo/docker-pull-tar/internal/buildinfo.Version=$env:VERSION " +
                "-X github.com/Potterluo/docker-pull-tar/internal/buildinfo.Commit=$env:COMMIT"
          go build -tags desktop,production -ldflags "$ld -H windowsgui" -o dockerpull-desktop.exe ./cmd/desktop
          if ($LASTEXITCODE -ne 0) { throw "desktop build failed" }
          # Assert the artifact really has no console, so a wrong build line
          # cannot ship silently.
          $b = [IO.File]::ReadAllBytes("dockerpull-desktop.exe")
          $o = [BitConverter]::ToInt32($b, 0x3C)
          $sub = [BitConverter]::ToUInt16($b, $o + 0x5C)
          if ($sub -ne 2) { throw "desktop artifact subsystem=$sub, want 2 (WINDOWS_GUI)" }
          Compress-Archive -Path dockerpull-desktop.exe -DestinationPath dockerpull_windows_amd64_desktop.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: dockerpull_windows_amd64_desktop
          path: dockerpull_windows_amd64_desktop.zip
          if-no-files-found: error

  publish:
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Check what will be attached
        run: ls -lR assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
